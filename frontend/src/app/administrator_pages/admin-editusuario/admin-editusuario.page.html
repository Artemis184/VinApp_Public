<app-admin-back-header
  title="Editar usuario"
  [showUserMenu]="true"
  (backAction)="cancelar()"
></app-admin-back-header>

<ion-content class="ion-padding">
  <ion-card class="edit-card">
    <ion-card-header>
      <ion-card-title class="ion-text-center">
        Datos del usuario
      </ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <form [formGroup]="form" (ngSubmit)="guardar()">
        <ion-list lines="none">
          <ion-item class="rounded-item">
            <ion-label position="stacked">Nombre completo</ion-label>
            <ion-input
              formControlName="full_name"
              type="text"
              placeholder="Ej. Juan Pérez"
            >
            </ion-input>
          </ion-item>

          <ion-item class="rounded-item">
            <ion-label position="stacked">Correo</ion-label>
            <ion-input
              formControlName="email"
              type="email"
              placeholder="ejemplo@correo.com"
            >
            </ion-input>
          </ion-item>

          <ion-item class="rounded-item">
            <ion-label position="stacked">Teléfono</ion-label>
            <ion-input
              formControlName="phone"
              type="tel"
              maxlength="10"
              placeholder="0939503157"
            >
            </ion-input>
          </ion-item>
          <ion-item class="rounded-item">
            <ion-label position="stacked">Dirección</ion-label>
            <ion-input
              formControlName="address"
              type="text"
              placeholder="Calle Principal y Secundaria"
            >
            </ion-input>
          </ion-item>

          <ion-item class="rounded-item">
            <ion-label position="stacked">Referencia</ion-label>
            <ion-input
              formControlName="reference"
              type="text"
              placeholder="Cerca de..."
            >
            </ion-input>
          </ion-item>

          <ion-item class="rounded-item">
            <ion-label position="stacked">Edad</ion-label>
            <ion-input
              formControlName="age"
              type="number"
              min="0"
              max="100"
              placeholder="25"
            >
            </ion-input>
          </ion-item>
        </ion-list>

        <div class="button-container ion-margin-top">
          <ion-button
            expand="block"
            class="save-btn"
            (click)="guardar()"
            [disabled]="form.invalid"
          >
            <ion-icon name="checkmark-circle" slot="start"></ion-icon>
            Guardar Cambios
          </ion-button>

          <ion-button
            expand="block"
            color="medium"
            fill="clear"
            class="cancel-btn"
            (click)="cancelar()"
          >
            <ion-icon name="close-circle" slot="start"></ion-icon>
            Cancelar
          </ion-button>
        </div>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
