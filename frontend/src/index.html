<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>VinApp - Aplicación Comunitaria Barrial</title>
    <meta
      name="description"
      content="VinApp es una aplicación comunitaria diseñada para facilitar la interacción, organización y gestión de información entre los miembros de una comunidad."
    />
    <meta
      name="keywords"
      content="aplicación comunitaria, barrio, gestión, alarmas, comunidad"
    />
    <meta name="author" content="VinApp" />
    <meta name="mobile-web-app-capable" content="yes" />

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      http-equiv="Cross-Origin-Opener-Policy"
      content="same-origin-allow-popups"
    />

    <!-- Open Graph for social sharing -->
    <meta
      property="og:title"
      content="VinApp - Aplicación Comunitaria Barrial"
    />
    <meta
      property="og:description"
      content="Conecta con tu comunidad y gestiona servicios de forma segura"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vinapp.artemisnet.cloud" />

    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <!-- add to homescreen for ios -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- GOOGLE IDENTITY SERVICES -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>

  <body>
    <app-root></app-root>
  </body>
</html>
